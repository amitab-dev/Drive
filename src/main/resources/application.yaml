spring:
  application:
    name: drive
  datasource:
    url: jdbc:postgresql://localhost:5432/drive
    username: postgres
    password: password
  flyway:
    enabled: true
    location: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  access-secret: ${JWT_SECRET:this-is-a-jwt-secret-make-sure-to-change-it-in-prod}
  access-ttl-in-sec: ${JWT_TTL:900}
  refresh-ttl-in-sec: ${REFRESH_TTL:604800}

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    bucket: ${S3_BUCKET_NAME}